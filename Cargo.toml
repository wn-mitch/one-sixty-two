[workspace]
resolver = "2"
members = ["engine", "engine-wasm", "engine-cli"]

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
libm = "=0.2.16"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Engine tests play full seasons against the prepared dataset.
[profile.test]
opt-level = 3
